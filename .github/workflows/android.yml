
name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "HATA: ZIP dosyasi bulunamadi!"
            exit 1
          fi

          echo "ZIP: $ZIP"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          echo "ZIP icerigi:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Find Gradle Project
        id: project
        shell: bash
        run: |
          FILE=$(find extracted -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) | head -n 1)

          if [ -z "$FILE" ]; then
            echo "HATA: ZIP icerisinde settings.gradle bulunamadi!"
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          echo "Proje bulundu: $DIR"
          ls -la "$DIR"

      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Adimsayar-Release-APK
          path: extracted/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
