name: Android APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Proje klasörünü bul
        id: proj
        run: |
          f=$(find . -name settings.gradle.kts | head -n 1)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: gradle --no-daemon assembleRelease
        working-directory: ${{ steps.proj.outputs.dir }}

      - uses: actions/upload-artifact@v4
        with:
          name: AdimPlus-release
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/*.apk
